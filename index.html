<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>今天吃点啥 · 手机演示</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; min-height: 100%; background: #fffaf4; }
    @media (prefers-color-scheme: dark) { html, body { background: #211e1a; } }
    button, select { touch-action: manipulation; }
    .cursor-interaction { cursor: pointer; }
    .food-location i, .food-next i { display: inline-block; font-style: normal; }
  </style>
  <script>
    (() => {
      const key = 'meal-demo-state';
      let initial = null;
      try { initial = JSON.parse(localStorage.getItem(key)); } catch {}
      window.openai = {
        widgetState: initial,
        async setWidgetState(state) {
          this.widgetState = state;
          try { localStorage.setItem(key, JSON.stringify(state)); } catch {}
        }
      };
    })();
  </script>
</head>
<body>
<div id="mobile-food-preview" class="viz-dotted-background">
  <div class="food-phone" aria-label="今天吃点啥，外卖推荐演示">
    <main class="food-page">
      <header class="food-header"><span class="food-logo">今天吃点啥</span><span class="food-demo">演示数据</span></header>
      <div class="food-location"><i aria-hidden="true">⌖</i>示例地址：科技园 A 栋</div>
      <h2>这一顿，帮你选好了。</h2>
      <p class="food-subtitle">按你的预算，找一份合胃口的外卖</p>
      <div class="food-filter"><label for="food-budget">这顿预算</label><select id="food-budget" class="cursor-interaction"><option value="20">20 元以内</option><option value="30" selected>30 元以内</option><option value="50">50 元以内</option></select></div>
      <article class="food-result" aria-live="polite" aria-atomic="true">
        <div class="food-illustration"><span id="food-emoji" aria-hidden="true">🍜</span><span class="food-pick">为你挑选</span></div>
        <div class="food-card-body"><div class="food-dish-row"><h3 id="food-dish">番茄牛肉面</h3><span class="food-price" id="food-price">¥26</span></div><p class="food-shop" id="food-shop">面香小馆 · 预计 30 分钟</p><p class="food-reason" id="food-reason">汤热味浓，荤素搭配，价格也在你的预算内。</p></div>
      </article>
      <button type="button" class="food-next cursor-interaction" id="food-next"><i aria-hidden="true">↻</i>换一个推荐</button>
      <p class="food-footnote">商家、价格和配送时间均为示例</p>
    </main>
  </div>
</div>
<style>
#mobile-food-preview{padding:0;display:flex;justify-content:center;box-sizing:border-box;background-image:none}
#mobile-food-preview .food-phone{--food-bg:#fffaf4;--food-bg:light-dark(#fffaf4,#211e1a);--food-card:#ffffff;--food-card:light-dark(#ffffff,#2e2923);--food-text:#2f281e;--food-text:light-dark(#2f281e,#f4eadb);--food-muted:#766c5e;--food-muted:light-dark(#766c5e,#c1b5a5);--food-line:#e9e0d6;--food-line:light-dark(#e9e0d6,#4b4238);--food-brand:#b74a13;--food-brand:light-dark(#b74a13,#ffc18c);--food-button:#bc4e16;--food-button:light-dark(#bc4e16,#f3a361);--food-button-text:#ffffff;--food-button-text:light-dark(#ffffff,#30200f);--food-soft:#fce9d2;--food-soft:light-dark(#fce9d2,#453122);width:100%;max-width:372px;border:1px solid var(--food-line);border-radius:26px;overflow:hidden;background:var(--food-bg);color:var(--food-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;box-shadow:0 12px 34px light-dark(#39270b18,#00000040);font-size:14px;line-height:1.5}
#mobile-food-preview *{box-sizing:border-box}
#mobile-food-preview .food-browser{display:flex;align-items:center;gap:7px;padding:13px 16px;background:var(--food-card);border-bottom:1px solid var(--food-line);font-size:12px;color:var(--food-muted)}
#mobile-food-preview .food-browser svg{width:13px;height:13px;flex:none}
#mobile-food-preview .food-demo{font-size:11px;color:var(--food-muted);margin-left:auto;white-space:nowrap}
#mobile-food-preview .food-page{padding:22px 20px 18px}
#mobile-food-preview .food-header{display:flex;align-items:center;gap:10px}
#mobile-food-preview .food-logo{font-size:17px;font-weight:600;color:var(--food-brand)}
#mobile-food-preview .food-location{display:flex;align-items:center;gap:5px;color:var(--food-muted);font-size:12px;margin-top:16px}
#mobile-food-preview .food-location svg{width:14px;height:14px;flex:none}
#mobile-food-preview h2{font-size:23px;line-height:1.4;letter-spacing:-.4px;margin:19px 0 5px;font-weight:600}
#mobile-food-preview .food-subtitle{margin:0;color:var(--food-muted);font-size:12px}
#mobile-food-preview .food-filter{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 15px}
#mobile-food-preview .food-filter label{font-size:13px;font-weight:500}
#mobile-food-preview select{background:var(--food-card);border:1px solid var(--food-line);color:var(--food-text);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;min-height:44px;max-width:175px}
#mobile-food-preview .food-result{border:1px solid var(--food-line);border-radius:17px;background:var(--food-card);overflow:hidden}
#mobile-food-preview .food-illustration{position:relative;background:var(--food-soft);display:flex;align-items:center;justify-content:center;min-height:140px}
#mobile-food-preview #food-emoji{font-size:72px;line-height:1.3}
#mobile-food-preview .food-pick{position:absolute;top:11px;left:12px;background:var(--food-card);color:var(--food-brand);font-size:11px;padding:4px 8px;border-radius:6px}
#mobile-food-preview .food-card-body{padding:16px}
#mobile-food-preview .food-dish-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#mobile-food-preview h3{font-size:18px;line-height:1.4;font-weight:600;margin:0}
#mobile-food-preview .food-price{font-size:23px;color:var(--food-brand);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
#mobile-food-preview .food-shop{margin:5px 0 12px;color:var(--food-muted);font-size:12px}
#mobile-food-preview .food-reason{font-size:13px;line-height:1.7;margin:0;padding-top:11px;border-top:1px solid var(--food-line)}
#mobile-food-preview .food-next{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:18px;border:0;border-radius:12px;background:var(--food-button);color:var(--food-button-text);font:inherit;font-weight:500}
#mobile-food-preview .food-next svg{width:17px;height:17px}
#mobile-food-preview .food-footnote{text-align:center;font-size:11px;color:var(--food-muted);margin:12px 0 0}
#mobile-food-preview .food-phone{max-width:460px;border:0;border-radius:0;box-shadow:none}
#mobile-food-preview .food-page{padding-top:30px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
</style>
<script>
(()=>{
 const root=document.getElementById('mobile-food-preview');
 const budget=root.querySelector('#food-budget');
 const meals=[
  {dish:'番茄牛肉面',price:26,emoji:'🍜',shop:'面香小馆',time:30,reason:'汤热味浓，荤素搭配，价格也在你的预算内。'},
  {dish:'香菇滑鸡饭',price:22,emoji:'🍚',shop:'街角饭堂',time:25,reason:'一份热乎的家常饭，适合想吃清淡一点的这顿。'},
  {dish:'鸡蛋蔬菜炒饭',price:16,emoji:'🍳',shop:'小巷厨房',time:25,reason:'简单管饱，价格实在，给这顿留点预算。'},
  {dish:'番茄鸡蛋面',price:18,emoji:'🍝',shop:'面香小馆',time:20,reason:'酸甜开胃的一碗面，忙的时候也能好好吃饭。'},
  {dish:'照烧三文鱼饭',price:39,emoji:'🍱',shop:'暖食便当',time:35,reason:'鱼肉配蔬菜，想给午饭换点花样可以试试。'}
 ];
 let current=0;
 function render(){
  const meal=meals[current];
  root.querySelector('#food-dish').textContent=meal.dish;
  root.querySelector('#food-price').textContent='¥'+meal.price;
  root.querySelector('#food-emoji').textContent=meal.emoji;
  root.querySelector('#food-shop').textContent=meal.shop+' · 预计 '+meal.time+' 分钟';
  root.querySelector('#food-reason').textContent=meal.reason;
 }
 function restore(saved){
  const state=saved?.modelContent;
  if(!state)return;
  if(['20','30','50'].includes(String(state.budget)))budget.value=String(state.budget);
  const index=meals.findIndex(m=>m.dish===state.dish && m.price<=Number(budget.value));
  current=index>=0?index:meals.findIndex(m=>m.price<=Number(budget.value));render();
 }
 function save(){
  const api=window.openai;
  if(api&&typeof api.setWidgetState==='function')api.setWidgetState({modelContent:{budget:Number(budget.value),dish:meals[current].dish},privateContent:null}).catch(()=>{});
 }
 budget.addEventListener('change',()=>{current=meals.findIndex(m=>m.price<=Number(budget.value));render();save();});
 root.querySelector('#food-next').addEventListener('click',()=>{
  for(let step=1;step<=meals.length;step++){const next=(current+step)%meals.length;if(meals[next].price<=Number(budget.value)){current=next;break;}}
  render();save();
 });
 render();restore(window.openai?.widgetState);
 window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
})();
</script>

</body>
</html>
